@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
#bk{--ink:#171614;--dk:#1C1A17;--pp:#F7F5F1;--ln:#E7E3DC;--mt:#6E6A62;--or:#F97316;--o2:#EA580C;--ck:#C2410C;font:400 16px/1.6 'Space Grotesk',system-ui,sans-serif;color:var(--ink);max-width:1120px;margin:0 auto;padding:0 20px;-webkit-text-size-adjust:100%}
#bk *{box-sizing:border-box;margin:0;padding:0}
#bk a{color:inherit}
#bk .i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bk .w{width:17px;height:17px;fill:currentColor;flex:none}
#bk .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;transition:.15s}
#bk .pl{background:var(--or);color:var(--ink)}
#bk .pl:hover{background:var(--o2)}
#bk .gh{border-color:#CBC7BF}
#bk .gh:hover{border-color:var(--ink)}
#bk .he .gh,#bk .ct .gh{border-color:#4A4740;color:var(--pp)}
#bk .he .gh:hover,#bk .ct .gh:hover{border-color:var(--or);color:var(--or)}
#bk .top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--ln)}
#bk .mk{height:78px;width:auto;object-fit:contain;flex:none;display:block}
#bk nav{display:flex;gap:22px;font-size:14px}
#bk nav a{color:var(--mt);text-decoration:none}
#bk nav a:hover{color:var(--ink)}
#bk .ic{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--or);display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:14px}
#bk .he{position:relative;overflow:hidden;background:var(--dk);color:var(--pp);border-radius:20px;margin-top:16px;min-height:580px;display:flex;flex-direction:column;justify-content:center}
#bk .hp{position:absolute;inset:0}
#bk .hp img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.15)}
#bk .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,22,20,.95) 0%,rgba(23,22,20,.78) 40%,rgba(23,22,20,.14) 80%,rgba(23,22,20,.06)),linear-gradient(0deg,rgba(23,22,20,.85) 0%,rgba(23,22,20,0) 45%)}
#bk .ct:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(247,245,241,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(247,245,241,.05) 1px,transparent 1px) 0 0/44px 44px;pointer-events:none}
#bk .hin{position:relative;padding:52px 48px;max-width:660px}
#bk .bc{position:relative;color:#cbc6be;font-size:12px;margin-bottom:14px}
#bk .bc a{text-decoration:none;color:var(--or)}
#bk .eb{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--or);border:1px solid #6E3A10;padding:7px 12px;border-radius:99px;margin-bottom:20px}
#bk .eb i{width:7px;height:7px;border-radius:50%;background:var(--or);animation:kp 1.8s infinite}
@keyframes kp{50%{opacity:.25}}

#bk .pn{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

#bk .pd{font-size:12.5px;color:var(--mt);margin-top:2px}
#bk .pc .btn{margin-top:auto;padding:12px;font-size:14px}
#bk .bs{background:var(--dk);border-color:var(--dk);color:var(--pp)}
#bk .bs .du,#bk .bs .pd{color:#B7B3AB}
#bk .bs .am{color:var(--or)}
#bk .bd{position:absolute;top:-11px;left:22px;background:var(--or);color:var(--ink);font-size:10px;font-weight:700;text-transform:uppercase;padding:5px 10px;border-radius:99px}
#bk .all{font-size:13px;color:var(--mt);margin-top:14px}
#bk .st{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
#bk .st>div{position:relative;border-top:2px solid var(--ln);padding-top:22px;font-size:13.5px;color:var(--mt)}
#bk .st>div:before{counter-increment:s;content:counter(s);position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--or);font:700 12px/26px 'Space Grotesk',sans-serif;text-align:center}
#bk .st h3{font-size:15px;color:var(--ink);margin-bottom:5px}
#bk .ct{position:relative;overflow:hidden;background:var(--dk);color:var(--pp);border-radius:20px;padding:44px 48px;display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center}
#bk .ct p{position:relative;color:#CBC6BE;font-size:15px;margin-top:10px}
#bk .sk{position:relative;display:grid;gap:10px}
#bk .fn{position:relative;font-size:12.5px;color:#A5A199;text-align:center}
#bk .ft{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--ln);margin-top:44px;padding:22px 0 6px;font-size:12.5px;color:var(--mt)}
